version: '3.8'

services:
  # 1. React Client Frontend
  web-client:
    build: .
    ports:
      - "5173:5173"
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:8090
    depends_on:
      - unified-backend

  # 2. SignFlow Unified Backend Service Engine (Port 8090)
  unified-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - NODE_ENV=production
