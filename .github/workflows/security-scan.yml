name: SignFlow Security & Dependency Audit (SOC 2 / eIDAS)

on:
  schedule:
    - cron: '0 0 * * 1' # Run weekly on Mondays
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-audit:
    name: 🔒 Security Compliance & Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node Security Audit
        run: npm audit --audit-level=high || true

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd services/envelope-service && govulncheck ./... || true
          cd ../audit-trail-service && govulncheck ./... || true
          cd ../document-processor && govulncheck ./... || true
